server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: TanStack Router handles routing client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite outputs assets with content hashes — cache aggressively
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
