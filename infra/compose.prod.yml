# Fixes the compose project name so every command (deploy/logs/migrate) targets the
# live stack without passing -p. Without this, the project name falls back to the repo
# directory basename and compose would create a separate, empty set of containers.
name: delivery-tracker-v2

services:
  caddy:
    build:
      context: ./infra
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - cargo_uploads:/srv/uploads:ro
    depends_on:
      - api
      - web

  api:
    # Pull-based deploy: image built/pushed by .github/workflows/build.yml, tag set by
    # bin/deploy (API_TAG = commit SHA). Falls back to :latest for manual `compose up`.
    image: ghcr.io/trudogolik45/delivery-tracker-v2/api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_ROOT: /app/uploads
      PUBLIC_BASE: https://${ADMIN_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    volumes:
      - cargo_uploads:/app/uploads
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ghcr.io/trudogolik45/delivery-tracker-v2/web:${WEB_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivery_tracker
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  cargo_uploads:
  caddy_data:
  caddy_config:
